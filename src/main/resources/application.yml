vk:
    api:
        base-url: https://api.vk.com/method
server:
    port: 9000
    servlet:
        encoding:
            charset: UTF-8
            enabled: true
            force: true
    tomcat:
        basedir: ./tmp-tomcat  # хранить временные файлы в ./tmp (относительно рабочей директории)
        background-processor:
            delay: 30s    # интервал очистки временных файлов
springdoc:
    show-actuator: true
    swagger-ui:
        enabled: true
        path: swagger-ui.html

jwt:
    header:
        Authorization
    secret:
        spmi
    time:
        expired:
            50000
        accept:
            300
    issuer:
        app
